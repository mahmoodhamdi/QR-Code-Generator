services:
  marketingqr-backend:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:4000}
      DB_PATH: /app/data/marketingqr.sqlite
    volumes:
      - ./data:/app/data
    ports:
      - "${PORT:-4000}:4000"
