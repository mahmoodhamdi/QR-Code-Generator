name: Build Vertical Bundles

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-vertical:
    name: Build ${{ matrix.brand }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [base, menuqr, eventqr, bizcard, printshop, marketingqr]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build ${{ matrix.brand }}
        run: BRAND=${{ matrix.brand }} NEXT_PUBLIC_BRAND=${{ matrix.brand }} npm run build

      - name: Package standalone output
        run: |
          mkdir -p .agent/builds/${{ matrix.brand }}
          cp -r .next/standalone/. .agent/builds/${{ matrix.brand }}/
          cp -r .next/static .agent/builds/${{ matrix.brand }}/.next/
          cp -r public .agent/builds/${{ matrix.brand }}/
          cd .agent/builds && tar czf ${{ matrix.brand }}.tar.gz ${{ matrix.brand }}

      - name: Upload vertical bundle
        uses: actions/upload-artifact@v4
        with:
          name: vertical-${{ matrix.brand }}
          path: .agent/builds/${{ matrix.brand }}.tar.gz
          retention-days: 14
